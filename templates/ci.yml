name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history for secret scanning

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: HTML validation
        run: npm run lint:html --if-present

      - name: CSS validation
        run: npm run lint:css --if-present

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check --if-present

      - name: SAST (Semgrep)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config auto --error --quiet \
            --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule javascript.express.security.audit.express-path-join-resolve-traversal.express-path-join-resolve-traversal \
            --exclude-rule javascript.express.security.audit.express-res-sendfile.express-res-sendfile \
            --exclude-rule javascript.express.security.audit.remote-property-injection.remote-property-injection

      # The only gate covering a malicious maintainer or typosquat: npm audit
      # sees published CVEs, the allowlist sees names, neither sees a package
      # that turned hostile in its latest release. Locally this is the npm
      # wrapper; CI has no wrapper, so it runs explicitly.
      #
      # Hard-fails when the secret is missing, by design: a skipped security
      # step that still reports a green pipeline is the fail-open pattern.
      # Set it at repo Settings > Secrets and variables > Actions.
      - name: Socket supply-chain scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo "::error::SOCKET_SECURITY_API_KEY is not set — supply-chain scanning cannot run."
            echo "Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          npx -y @socketsecurity/cli@1.1.102 ci

      - name: Dependency audit
        run: npm run security

      - name: License check
        run: npm run licenses

      # Build and tests mirror the local gate order. Without them CI verified
      # only that the code is well-formed, never that it runs — while the policy
      # called CI "the same gates re-run on GitHub". Tiers are --if-present, so
      # a project only runs what it defines; smoke/integration are required to
      # be self-contained (own port, temp data dir), which is what lets them run
      # on a runner with nothing already listening.
      #
      # deps:check is deliberately absent: it runs
      # ../build-policy/scripts/check-allowlist.js, a sibling repo that does not
      # exist in a CI checkout. It stays a local/pre-commit gate.
      - name: Build
        run: npm run build --if-present

      - name: Unit tests
        run: npm run test:unit --if-present

      - name: Smoke tests
        run: npm run test:smoke --if-present

      - name: Integration tests
        run: npm run test:integration --if-present

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
